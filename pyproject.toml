[build-system]
requires = []
build-backend = "build_backend"
backend-path = ["scripts"]

[project]
name = "graph-engineering-workflow"
version = "0.1.0"
description = "A platform-neutral graph engineering system for reliable software delivery"
requires-python = ">=3.12"
dependencies = ["cryptography==50.0.0", "packaging==26.3"]
license = "LicenseRef-Proprietary"

[project.scripts]
graph-engineering = "graph_engineering.cli:main"

[tool.gew.build.package-roots]
"core/graph_engineering/core" = "graph_engineering.core"
"application/graph_engineering/application" = "graph_engineering.application"
"storage/graph_engineering/storage" = "graph_engineering.storage"
"adapters/graph_engineering/adapters" = "graph_engineering.adapters"

[tool.gew.build.owned-root-files]
"core/graph_engineering/__init__.py" = "graph_engineering/__init__.py"
"application/graph_engineering/cli.py" = "graph_engineering/cli.py"

[tool.gew.build.offline-wheel-policy]
max-members = 4096
max-member-bytes = 67108864
max-total-bytes = 536870912
compatible-tags = ["py3-none-any"]
max-closure-wheels = 64
max-closure-bytes = 2147483648
max-dependency-edges = 4096
max-dependency-depth = 32
max-requirements = 4096

[tool.gew.build.package-parser-requirement]
path = "config/supply-chain/extension-package-parser-requirement-v1.json"
sha256 = "195b77be3e2a5ea41236f3fbbfdfca62be7e63d5db377998c6fe662c316f1406"

